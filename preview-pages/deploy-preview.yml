name: Nasadit náhled

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Příprava GitHub Pages
        uses: actions/configure-pages@v4

      - name: Nahrání složky site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Nasazení
        id: deployment
        uses: actions/deploy-pages@v4
